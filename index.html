<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1116">
<meta name="apple-mobile-web-app-title" content="Frontline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Republic Frontline</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0c1116;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#game {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; outline: none;
  }
  #safe {
    position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10; background: #0c1116; color: #b8c4c3;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    font: 600 15px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 2px; text-align: center; padding: 24px;
  }
  #rotate .phone {
    width: 44px; height: 76px; border: 4px solid #7cf0ff; border-radius: 6px;
    animation: turn 2.2s ease-in-out infinite;
  }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  /* login form overlay (account screen) */
  #login { display: none; position: fixed; z-index: 5; flex-direction: column; gap: 8px; }
  #login input, #login button {
    font: 600 16px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 1px; padding: 9px 10px; border-radius: 0;
    border: 2px solid #101217; background: #151c23; color: #e6ece9; outline: none;
    -webkit-user-select: text; user-select: text; touch-action: manipulation; min-height: 44px; box-sizing: border-box;
  }
  #login input:focus { border-color: #38b8e0; }
  #login button { background: #38b8e0; color: #0c1116; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="rotate"><div class="phone"></div><div>ROTATE YOUR DEVICE<br>TO LANDSCAPE</div></div>
<noscript><p style="color:#fff">Republic Frontline needs JavaScript.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
