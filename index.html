<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1116">
<title>Republic Frontline</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0c1116;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#game {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; outline: none;
  }
  #safe {
    position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10; background: #0c1116; color: #b8c4c3;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    font: 600 15px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 2px; text-align: center; padding: 24px;
  }
  #rotate .phone {
    width: 44px; height: 76px; border: 4px solid #7cf0ff; border-radius: 6px;
    animation: turn 2.2s ease-in-out infinite;
  }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="rotate"><div class="phone"></div><div>ROTATE YOUR DEVICE<br>TO LANDSCAPE</div></div>
<noscript><p style="color:#fff">Republic Frontline needs JavaScript.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
